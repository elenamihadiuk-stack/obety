@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg:#f6f2ea; --surface:#fffdf8; --surface2:#efe8db; --raise:#e6ddcc;
  --line:#e2d8c7; --line-soft:#eee6d8;
  --fg:#2a241c; --dim:#6b6052; --faint:#9c9180;
  --gold:#9c7227; --gold-dim:#b8933f; --gold-bg:#f6ebd2;
  --keep:#48763c; --keep-bg:#e8f0e3; --keep-line:#c6d9bd;
  --brk:#9f4a39; --brk-bg:#f8e7e2; --brk-line:#e8cac2;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f6f2ea; --surface:#fffdf8; --surface2:#efe8db; --raise:#e6ddcc;
  --line:#e2d8c7; --line-soft:#eee6d8;
  --fg:#2a241c; --dim:#6b6052; --faint:#9c9180;
  --gold:#9c7227; --gold-dim:#b8933f; --gold-bg:#f6ebd2;
  --keep:#48763c; --keep-bg:#e8f0e3; --keep-line:#c6d9bd;
  --brk:#9f4a39; --brk-bg:#f8e7e2; --brk-line:#e8cac2;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ——— Экран входа ——— */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#lock::before{content:"";position:absolute;inset:0;background-image:var(--cover);
  background-size:cover;background-position:38% 32%}
#lock::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,10,8,.42) 0%,rgba(12,10,8,.76) 42%,rgba(12,10,8,.95) 100%)}
#lock .inner{position:relative;z-index:2;width:100%;max-width:340px;display:flex;flex-direction:column;gap:18px;text-align:center}
#lock h1,#lock .seal{text-shadow:0 2px 14px rgba(0,0,0,.5)}
#lock p,#lock .check span{color:#cfc3b2}
#lock .inp{background:rgba(22,19,16,.86);border-color:rgba(212,164,76,.35);color:#f2ebe0}
#lock .field label{color:#b5a894}
.seal{width:54px;height:54px;margin:0 auto;border-radius:50%;border:1px solid var(--gold-dim);display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-size:24px;line-height:1}
#lock h1{font-family:var(--serif);font-weight:400;font-size:27px;margin:0;letter-spacing:.01em}
#lock p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:7px;text-align:left}
.field label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:17px;color:var(--fg)}
.inp::placeholder{color:var(--faint)}
.btn{display:block;width:100%;background:var(--gold);color:#17120a;border-radius:11px;padding:14px;font-size:16px;font-weight:600;text-align:center}
.btn:active{opacity:.82}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--brk);border:1px solid var(--brk-line);font-weight:500}
.err{color:var(--brk);font-size:14px;min-height:1.2em}
.hint{font-size:12.5px;color:var(--faint);line-height:1.5}
.check{display:flex;gap:9px;align-items:flex-start;text-align:left;font-size:14px;color:var(--dim)}
.check input{width:20px;height:20px;accent-color:var(--gold);margin:1px 0 0}

/* ——— Шапка ——— */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-soft)}
#top .row{display:flex;align-items:center;gap:10px;padding-block:11px 9px}
.navbtn{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--dim);font-size:19px;background:var(--surface);border:1px solid var(--line-soft)}
.navbtn[disabled]{opacity:.32}
.datebox{flex:1;min-width:0;text-align:center;line-height:1.25}
.datebox b{display:block;font-weight:600;font-size:16.5px;letter-spacing:.005em}
.datebox span{display:block;font-size:12px;color:var(--gold);letter-spacing:.05em;margin-top:1px}
.dots{display:flex;gap:5px;justify-content:center;padding-bottom:10px}
.dot{width:100%;max-width:44px;height:4px;border-radius:2px;background:var(--raise)}
.dot.k{background:var(--keep)} .dot.b{background:var(--brk)}
#today-btn{display:none;margin:0 auto 10px;font-size:12.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:5px 14px}
#today-btn.on{display:block}

/* ——— Полотно ——— */
main{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-top:14px}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.keep{border-color:var(--keep-line)} .card.brk{border-color:var(--brk-line)}
.cbody{padding:14px 15px 13px}
.meta{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.num{font-family:var(--serif);font-size:13px;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.cat{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);line-height:1.35}
.vow{font-family:var(--serif);font-size:17.5px;line-height:1.45;margin:0}
.choice{display:flex;border-top:1px solid var(--line-soft)}
.choice button{flex:1;padding:13px 6px;font-size:14.5px;font-weight:500;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:7px}
.choice button+button{border-left:1px solid var(--line-soft)}
.choice button .g{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--raise);display:grid;place-items:center;font-size:12px;line-height:1}
.choice button.on{color:var(--fg);font-weight:600}
.choice button.on.k{background:var(--keep-bg)} .choice button.on.k .g{background:var(--keep);border-color:var(--keep);color:#10170d}
.choice button.on.b{background:var(--brk-bg)} .choice button.on.b .g{background:var(--brk);border-color:var(--brk);color:#1d100d}
.anti{border-top:1px solid var(--line-soft);background:var(--brk-bg);padding:12px 15px 13px;display:flex;flex-direction:column;gap:7px}
.anti label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brk)}
.anti textarea{width:100%;min-height:88px;background:var(--surface);border:1px solid var(--brk-line);border-radius:10px;padding:11px 12px;font-size:15.5px;line-height:1.45;resize:vertical}
.clearrow{display:flex;justify-content:flex-end;padding:0 15px 11px;margin-top:-3px}
.clearrow button{font-size:12.5px;color:var(--faint);padding:4px 2px}

/* Цитата */
.quote{background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:var(--r);padding:16px 17px}
.quote p{font-family:var(--serif);font-size:16.5px;line-height:1.52;margin:0 0 9px;font-style:italic}
.quote cite{display:block;font-style:normal;font-size:11.5px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase}
/* Обложка под цитатой дня */
.quote.hero{position:relative;border:1px solid var(--line);padding:0;min-height:208px;overflow:hidden;
  display:flex;align-items:flex-end;
  background-image:linear-gradient(180deg,rgba(10,8,6,.30) 0%,rgba(10,8,6,.62) 46%,rgba(10,8,6,.92) 100%),var(--cover);
  background-size:cover,cover;background-position:50% 22%,50% 22%}
.quote.hero .qt{position:relative;z-index:2;padding:16px 17px 15px;width:100%}
.quote.hero p{color:#f6efe4;margin:0 0 8px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.quote.hero cite{color:#e3bf78;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* Секции */
.sec{margin:4px 0 -4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.prow+.prow{border-top:1px solid var(--line-soft)}
.pname{flex:1;min-width:0;font-size:15.5px;line-height:1.3}
.pname small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.stepper{display:flex;align-items:center;gap:0;flex:none;background:var(--surface2);border-radius:10px;border:1px solid var(--line-soft)}
.stepper button{width:40px;height:38px;font-size:20px;color:var(--gold);display:grid;place-items:center}
.stepper input{width:54px;height:38px;background:none;border:none;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.toggle{flex:none;width:52px;height:32px;border-radius:99px;background:var(--raise);position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle.on{background:var(--keep)}
.toggle.on::after{transform:translateX(20px)}

/* Статистика */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 10px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:25px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:10.5px;letter-spacing:.055em;text-transform:uppercase;color:var(--faint);margin-top:5px;line-height:1.3}
.segs{display:flex;background:var(--surface2);border:1px solid var(--line-soft);border-radius:11px;padding:3px;gap:3px}
.segs button{flex:1;padding:8px 4px;font-size:13px;color:var(--dim);border-radius:8px}
.segs button.on{background:var(--surface);color:var(--fg);font-weight:600;border:1px solid var(--line)}
.chart{display:flex;align-items:flex-end;gap:2px;height:112px;padding:14px 14px 0;overflow-x:auto}
.bar{flex:1;min-width:5px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%}
.bar i{display:block;border-radius:1.5px}
.bar i.k{background:var(--keep)} .bar i.b{background:var(--brk)} .bar i.n{background:var(--raise)}
.xax{display:flex;justify-content:space-between;padding:7px 14px 13px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.lgrow{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14.5px}
.lgrow+.lgrow{border-top:1px solid var(--line-soft)}
.lgrow .t{flex:1;min-width:0;line-height:1.35}
.lgrow .t small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.lgrow .v{flex:none;font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold)}
.meter{height:5px;border-radius:3px;background:var(--raise);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--keep)}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:30px 20px;line-height:1.55}

/* Настройки */
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.srow+.srow{border-top:1px solid var(--line-soft)}
.srow .t{flex:1;min-width:0;font-size:15.5px}
.srow .t small{display:block;font-size:12px;color:var(--faint);margin-top:2px;line-height:1.4}
.srow .chev{color:var(--faint);font-size:17px;flex:none}
.srow input[type=date],.srow input[type=text]{flex:none;max-width:52%;background:var(--surface2);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;font-size:15px}
.srow input[type=text]{flex:1;max-width:none}
#backup textarea{width:100%;min-height:130px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:12px;font-family:ui-monospace,Menlo,monospace;line-height:1.4;resize:vertical}
.vowlist{display:flex;flex-direction:column;gap:9px}
.vowitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.vowitem .num{margin-bottom:3px;display:block}
.vowitem p{margin:3px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.42}

/* Нижние вкладки */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  display:flex}
#tabs button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;letter-spacing:.02em}
#tabs button .ic{font-size:18px;line-height:1}
#tabs button.on{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:9px 18px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* Записи: плюс / минус / антидот */
.notes{border-top:1px solid var(--line-soft);display:flex;flex-direction:column}
.nf{display:flex;flex-direction:column;gap:6px;padding:12px 15px 13px}
.nf+.nf{border-top:1px solid var(--line-soft)}
.nf label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.nf.p label{color:var(--keep)} .nf.b label{color:var(--brk)} .nf.a label{color:var(--gold)}
.nf textarea{width:100%;min-height:62px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15.5px;line-height:1.45;resize:vertical}
.nf textarea::placeholder{color:var(--faint)}
.nf.p textarea:focus{border-color:var(--keep-line)} .nf.b textarea:focus{border-color:var(--brk-line)}
.morelink{width:100%;border-top:1px solid var(--line-soft);padding:12px;font-size:13.5px;color:var(--gold)}
.exlink{margin-top:9px;font-size:12.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:4px 13px}
.ex{background:var(--surface2);border-top:1px solid var(--line-soft);padding:4px 15px 11px}
.ex.flat{background:none;border-top:1px solid var(--line-soft);margin-top:10px;padding:4px 0 0}
.exrow{padding:9px 0}
.exrow+.exrow{border-top:1px dashed var(--line)}
.exrow b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.exrow.k b{color:var(--keep)} .exrow.b b{color:var(--brk)} .exrow.a b{color:var(--gold)}
.exrow p{margin:0;font-size:14.5px;line-height:1.45;color:var(--dim)}
.exsrc{font-size:11.5px;color:var(--faint);padding-top:8px;border-top:1px dashed var(--line);font-style:italic}
.dot.w{background:var(--gold-dim)}
/* Редактор списков практик */
.srow.lst{gap:8px}
.srow.lst input[type=text]{flex:1;min-width:0;max-width:none}
.basenum{flex:none;width:72px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:9px;
  padding:8px 6px;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.basenum::-webkit-outer-spin-button,.basenum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lx{flex:none;width:30px;height:30px;border-radius:8px;color:var(--brk);font-size:19px;line-height:1}
.addrow .t{color:var(--gold);font-size:14.5px}
.addrow .chev{color:var(--gold);font-size:19px}
.seccap{display:block;text-transform:none;letter-spacing:0;font-size:11px;color:var(--faint);margin-top:3px}
.cbody.bk{display:flex;flex-direction:column;gap:11px}
.cbody.bk .hint{margin:0}
.cbody.bk textarea{width:100%;min-height:124px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px;font-size:12px;font-family:ui-monospace,Menlo,monospace;line-height:1.4;resize:vertical}
.cbody.bk .field{gap:7px}

/* ——— Раскрывающаяся карточка обета ——— */
.vhead{display:block;width:100%;text-align:left;padding:13px 15px 11px}
.vhead .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.vhead .vow{display:block;font-family:var(--serif);font-size:17.5px;line-height:1.45;color:var(--fg)}
.vhead .vfoot{display:flex;align-items:center;gap:8px;margin-top:9px}
.vhead .chev{margin-left:auto;flex:none;color:var(--dim);font-size:15px;line-height:1;padding-left:6px}
.vhead.open .chev{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.ch{font-style:normal;font-size:10.5px;letter-spacing:.055em;text-transform:uppercase;
  border-radius:99px;padding:3px 9px;border:1px solid transparent;white-space:nowrap}
.ch.k{color:var(--keep);background:var(--keep-bg);border-color:var(--keep-line)}
.ch.b{color:var(--brk);background:var(--brk-bg);border-color:var(--brk-line)}
.ch.a{color:var(--gold);background:var(--gold-bg);border-color:var(--gold-dim)}
.ch.e{color:var(--faint);border-color:var(--line)}
.notes .exlink{margin:12px 15px 2px}

/* ——— Послание дня ——— */
.msgcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:11px 15px 0;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.mhead .again{margin-left:auto;font-size:12px;letter-spacing:0;text-transform:none;color:var(--gold);padding:3px 2px}
.mbody{padding:9px 15px 14px}
.mbody p{font-family:var(--serif);font-size:16.5px;line-height:1.5;margin:0 0 8px;font-style:italic}
.mbody cite{display:block;font-style:normal;font-size:11.5px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase}
.mdraw{width:100%;padding:14px;font-size:14.5px;color:var(--gold)}

/* ——— Прибежище: вижу себя Ваджрайогини ——— */
.bigtap{flex:none;background:var(--gold);color:#17120a;font-weight:600;font-size:14.5px;
  border-radius:99px;padding:11px 20px}
.bigtap:active{opacity:.85}
.vq{border-top:1px solid var(--line-soft);background:var(--surface2);padding:12px 15px 13px}
.vq p{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin:0 0 7px;font-style:italic;color:var(--fg)}
.vq cite{display:block;font-style:normal;font-size:11px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase}

/* ——— Добрые дела ——— */
.gdrow{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;line-height:1.35}
.gdrow+.gdrow{border-top:1px solid var(--line-soft)}
.gdrow .t{flex:1;min-width:0}
.gdrow.none .t{color:var(--faint);font-size:14px}
.gdadd{display:flex;align-items:center;gap:8px;padding:10px 12px 11px;border-top:1px solid var(--line-soft);background:var(--surface2)}
.gdadd input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15.5px;color:var(--fg)}
.gdadd input::placeholder{color:var(--faint)}
.gdadd button{flex:none;width:42px;height:42px;border-radius:10px;background:var(--gold);color:#17120a;font-size:22px;line-height:1}

/* ——— Сорадование ——— */
.rej{background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:var(--r);padding:14px 16px 15px}
.rej b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--gold);margin-bottom:6px}
.rej p{margin:0;font-size:14.5px;line-height:1.45;color:var(--dim)}
.rej ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.rej li{font-size:14.5px;line-height:1.4}
.rej button{margin-top:13px;width:100%;background:var(--gold);color:#17120a;font-weight:600;font-size:15px;
  border-radius:11px;padding:12px}
#tabs button.badge .ic{position:relative}
#tabs button.badge .ic::after{content:"";position:absolute;top:-1px;right:-6px;width:7px;height:7px;
  border-radius:50%;background:var(--gold)}

/* ——— Круги цикла в статистике ——— */
.cbody.circ{display:flex;flex-direction:column;gap:9px}
.crow{display:flex;justify-content:space-between;font-size:14.5px;color:var(--dim)}
.meter.big{height:8px;border-radius:4px;margin-top:0}
.meter.big i{background:var(--gold)}
.cbody.circ .hint{margin:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="lock" class="wrap">
  <div class="inner">
    <div class="seal">◇</div>

    <div class="field">
      <label for="pw" id="pw-label">Пароль</label>

    <div class="err" id="lock-err"></div>
    <button class="btn" id="lock-go">Войти</button>

  </div>
</div>

/* ===== расшифровка содержимого ===== */
const KEYSTORE = 'vd.key.v1';
const B64 = {
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  enc: b => btoa(String.fromCharCode.apply(null, Array.from(new Uint8Array(b))))
};
function cryptoReady(){ return typeof crypto!=='undefined' && crypto.subtle && typeof TextDecoder!=='undefined'; }
async function keyFromPass(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:B64.dec(ENC.s), iterations:250000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function openContent(key){
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:B64.dec(ENC.i) }, key, B64.dec(ENC.c));
  const data = JSON.parse(new TextDecoder().decode(buf));
  VOWS = data.v; QUOTES = data.q; EX = data.e || {}; VQUOTES = data.vq || [];
}
async function unlockWithPass(pass){
  const key = await keyFromPass(pass);
  await openContent(key);                       /* неверная фраза — здесь и упадёт */
  return B64.enc(await crypto.subtle.exportKey('raw', key));
}
async function unlockWithSavedKey(b64){
  const key = await crypto.subtle.importKey('raw', B64.dec(b64), 'AES-GCM', true, ['decrypt']);
  await openContent(key);
}

/* ===== хранилище ===== */
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  drop(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const KEY='vd.store.v1', SESS='vd.session.v1';
function blank(){
  return { v:3, auth:null,
    set:{ start:iso(new Date()), theme:'', keepDays:183, rejoice:0, rejoiceAck:'', vqi:0,
      mantras:[{n:'Будда Медицины',base:0},{n:'Гуаньинь',base:0},{n:'Ямантака',base:0},{n:'Ваджрайогини',base:0}],
      sadhanas:[{n:'Садхана Ямантаки',base:109},{n:'Садхана Ваджрайогини',base:251}] },
    d:{}, agg:{} };
}
let S = blank();
function load(){
  const raw = LS.get(KEY);
  if(raw){ try{ const o=JSON.parse(raw); S=Object.assign(blank(),o); S.set=Object.assign(blank().set,o.set||{}); }catch(e){} }
  migrate();
}
/* названия по умолчанию */
const DEF_MANTRAS  = ['Будда Медицины','Гуаньинь','Ямантака','Ваджрайогини'];
const DEF_SADHANAS = [{n:'Садхана Ямантаки',base:109},{n:'Садхана Ваджрайогини',base:251}];
const PH_MANTRA  = /^(мантра|мантра \d|мантра \d-го посвящения|новая мантра)$/i;
const PH_SADHANA = /^(садхана|садхана \d|новая садхана)$/i;

/* перевод старых записей в новый вид — ничего не теряется */
function migrate(){
  const st = S.set;
  if(Array.isArray(st.mantras) && st.mantras.length && typeof st.mantras[0]==='string')
    st.mantras = st.mantras.map(n=>({n:n,base:0}));
  if(!Array.isArray(st.sadhanas))
    st.sadhanas = [{ n: st.sadhana || 'Садхана', base:0 }];
  st.mantras = st.mantras.map(x=> typeof x==='string' ? {n:x,base:0} : {n:x.n||'Мантра', base:+x.base||0});
  st.sadhanas = st.sadhanas.map(x=> typeof x==='string' ? {n:x,base:0} : {n:x.n||'Садхана', base:+x.base||0});
  /* один раз подставляем настоящие названия вместо заглушек первой версии.
     То, что переименовано вручную, не трогаем. */
  if(!st.named){
    st.mantras.forEach((x,i)=>{ if(PH_MANTRA.test(String(x.n).trim()) && DEF_MANTRAS[i]) x.n = DEF_MANTRAS[i]; });
    while(st.mantras.length < DEF_MANTRAS.length)
      st.mantras.push({ n: DEF_MANTRAS[st.mantras.length], base:0 });
    if(st.sadhanas.length===1 && PH_SADHANA.test(String(st.sadhanas[0].n).trim())){
      const kept = +st.sadhanas[0].base || 0;
      st.sadhanas = DEF_SADHANAS.map((x,i)=>({ n:x.n, base: i===0 ? (kept||x.base) : x.base }));
    }
    st.named = 1;
  }
  Object.keys(S.d).forEach(k=>{
    const r = S.d[k]; if(!r) return;
    if(!r.p) r.p = {};
    if(!Array.isArray(r.p.sa)) r.p.sa = (typeof r.p.s==='number') ? [r.p.s] : [];
    if(!Array.isArray(r.p.m)) r.p.m = [];
    r.p.med = r.p.med?1:0; r.p.yoga = r.p.yoga?1:0;
    if(!Array.isArray(r.gd)) r.gd = [];
    r.gd = r.gd.map(x=> typeof x==='string' ? x : String(x&&x.t || '')).filter(x=>x.trim());
    if(typeof r.vy!=='number') r.vy = 0;
    if(r.m) Object.keys(r.m).forEach(n=>{ const x=r.m[n];
      if(typeof x.p!=='string') x.p=''; if(typeof x.mn!=='string') x.mn='';
      if(typeof x.a!=='string') x.a=''; if(typeof x.s!=='number') x.s=0;
      /* отметка теперь выводится из самих записей, а не из отдельных галочек */
      x.s = deriveStatus(x); });
  });
  if(typeof S.set.rejoice!=='number') S.set.rejoice = 0;
  if(typeof S.set.vqi!=='number') S.set.vqi = 0;
  if(typeof S.set.rejoiceAck!=='string') S.set.rejoiceAck = '';
  Object.keys(S.agg||{}).forEach(k=>{ const a=S.agg[k];
    if(!Array.isArray(a.sa)) a.sa = (typeof a.s==='number') ? [a.s] : [];
    if(!Array.isArray(a.m)) a.m = [];
    if(typeof a.vy!=='number') a.vy = 0;
    if(typeof a.gd!=='number') a.gd = 0; });

function iso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12,0,0,0); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

function human(s){ const d=parse(s), t=iso(new Date());
  if(s===t) return 'Сегодня, '+d.getDate()+' '+MO[d.getMonth()];
  if(s===addDays(t,-1)) return 'Вчера, '+d.getDate()+' '+MO[d.getMonth()];

}

  const r=S.d[s]; if(!r) return r;

/* Отметка больше не ставится галочкой: она следует из того, что записано.
   Есть «минус» — нарушение; иначе есть «плюс» — соблюдение; иначе отметки нет. */
function deriveStatus(m){

/* ===== хеш пароля (SHA-256, чистый JS — работает офлайн и из файла) ===== */
const K256=(function(){const k=[];let n=2;for(let i=0;i<64;){let ip=true;for(let f=2;f*f<=n;f++) if(n%f===0){ip=false;break;}
  if(ip){k.push(Math.floor((Math.cbrt(n)%1)*4294967296)|0);i++;}n++;}return k;})();
const H256=(function(){const h=[],p=[2,3,5,7,11,13,17,19];for(let i=0;i<8;i++)h.push(Math.floor((Math.sqrt(p[i])%1)*4294967296)|0);return h;})();
function sha256(str){
  const utf=unescape(encodeURIComponent(str)), len=utf.length, words=[];
  for(let i=0;i<len;i++) words[i>>2]=(words[i>>2]||0)|(utf.charCodeAt(i)<<(24-(i%4)*8));
  words[len>>2]=(words[len>>2]||0)|(0x80<<(24-(len%4)*8));
  const total=(((len+8)>>6)+1)<<4; while(words.length<total) words.push(0);
  words[total-1]=len*8;
  let H=H256.slice(); const w=new Array(64), rr=(x,s)=>(x>>>s)|(x<<(32-s));
  for(let i=0;i<total;i+=16){
    for(let t=0;t<16;t++) w[t]=words[i+t]|0;
    for(let t=16;t<64;t++){ const a=w[t-15],b=w[t-2];
      w[t]=((rr(b,17)^rr(b,19)^(b>>>10))+w[t-7]+(rr(a,7)^rr(a,18)^(a>>>3))+w[t-16])|0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K256[t]+w[t])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>((x>>>0).toString(16).padStart(8,'0'))).join('');
}
function pwHash(pw,salt){ let h=sha256(salt+'\u0001'+pw); for(let i=0;i<4000;i++) h=sha256(h+salt); return h; }
function newSalt(){ const a=new Uint8Array(16);
  if(typeof crypto!=='undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<16;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }

function weekTotals(end){

/* ===== статистика ===== */
function collect(range){
  const t = iso(new Date());
  const keys = Object.keys(S.d).sort();
  const from = range ? addDays(t,-(range-1)) : (keys[0]||t);
  const out = { days:[], plus:0, minus:0, marked:0, slots:0, notes:0, byCat:{}, byVow:{},
                m:S.set.mantras.map(()=>0), sa:S.set.sadhanas.map(()=>0), med:0, yoga:0,
                vy:0, gd:0, from:from };
  for(let d=from; d<=t; d=addDays(d,1)){
    const r = S.d[d]; let k=0,b=0;
    if(r){
      vowsOf(cycleDay(d)).forEach(n=>{ const mk=r.m&&r.m[n]; if(!mk) return;
        if(hasNotes(mk)) out.notes++;
        if(!mk.s) return;
        const cat = VOWS[n].c;
        out.byCat[cat] = out.byCat[cat] || {k:0,b:0};
        if(mk.s===1){ k++; out.byCat[cat].k++; }
        else { b++; out.byCat[cat].b++; out.byVow[n]=(out.byVow[n]||0)+1; }
      });
      out.vy += r.vy||0;
      out.gd += Array.isArray(r.gd) ? r.gd.length : 0;
      if(r.p){
        (r.p.m||[]).forEach((v,i)=>{ if(out.m[i]!==undefined) out.m[i]+=v||0; });
        (r.p.sa||[]).forEach((v,i)=>{ if(out.sa[i]!==undefined) out.sa[i]+=v||0; });
        out.med+=r.p.med?1:0; out.yoga+=r.p.yoga?1:0;
      }
    }
    out.days.push({d:d,k:k,b:b}); out.plus+=k; out.minus+=b; out.marked+=k+b; out.slots+=6;
  }
  return out;
}
function streak(){
  const t = iso(new Date()); let d = t, n = 0;
  const full = s => { const r=S.d[s]; if(!r||!r.m) return false;
    return vowsOf(cycleDay(s)).every(x=>r.m[x] && r.m[x].s); };
  if(!full(d)) d = addDays(d,-1);
  while(full(d)){ n++; d = addDays(d,-1); if(n>4000) break; }
  return n;
}

/* ===== сворачивание архива ===== */
function prune(){
  const t = iso(new Date()), keep = S.set.keepDays||183; let changed=false;
  Object.keys(S.d).forEach(d=>{
    if(diffDays(d,t) <= keep) return;
    const r=S.d[d], mk=d.slice(0,7);
    const a = S.agg[mk] = S.agg[mk] || {days:0,plus:0,minus:0,m:[],sa:[],med:0,yoga:0,vy:0,gd:0};
    if(typeof a.vy!=='number') a.vy=0; if(typeof a.gd!=='number') a.gd=0;
    if(!Array.isArray(a.m)) a.m=[]; if(!Array.isArray(a.sa)) a.sa=[];
    a.days++;
    a.vy += r.vy||0;
    a.gd += Array.isArray(r.gd) ? r.gd.length : 0;
    if(r.m) Object.values(r.m).forEach(x=>{ if(x.s===1) a.plus++; else if(x.s===-1) a.minus++; });
    if(r.p){
      (r.p.m||[]).forEach((v,i)=>{ a.m[i]=(a.m[i]||0)+(v||0); });
      (r.p.sa||[]).forEach((v,i)=>{ a.sa[i]=(a.sa[i]||0)+(v||0); });
      a.med+=r.p.med?1:0; a.yoga+=r.p.yoga?1:0;
    }
    dropDay(d); changed=true;
  });
  if(changed) save(true);
}

async function tryAuth(){
  const pw = $('#pw').value, err = $('#lock-err'), btn = $('#lock-go');
  if(!pw){ err.textContent='Введите пароль'; return; }

  if(LOCKED){
    if(!cryptoReady()){
      err.textContent='Страница открыта не по защищённому адресу — расшифровка недоступна'; return; }
    err.textContent=''; btn.disabled = true; btn.textContent = 'Открываю…';
    try{
      const raw = await unlockWithPass(pw);
      if($('#remember').checked){ LS.set(SESS,'1'); LS.set(KEYSTORE, raw); }
      else { LS.drop(SESS); LS.drop(KEYSTORE); }
      showApp();
    }catch(e){
      err.textContent = 'Неверная парольная фраза'; $('#pw').value='';
    }finally{ btn.disabled = false; btn.textContent = 'Войти'; }
    return;
  }

  if(!S.auth){
    if(pw.length < 4){ err.textContent='Не короче 4 символов'; return; }
    if(pw !== $('#pw2').value){ err.textContent='Пароли не совпадают'; return; }
    const salt = newSalt();
    S.auth = { salt:salt, h:pwHash(pw,salt) };
    save(true);
  } else {
    if(pwHash(pw, S.auth.salt) !== S.auth.h){ err.textContent='Неверный пароль'; $('#pw').value=''; return; }
  }
  if($('#remember').checked) LS.set(SESS,'1'); else LS.drop(SESS);
  showApp();
}

/* ===== нажатия ===== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  if(b.id==='lock-go'){ tryAuth(); return; }

  if(b.id==='prev'){ cur = addDays(cur,-1); openNotes.clear(); openEx.clear(); renderTop(); renderDay(); renderPr(); return; }
  if(b.id==='next'){ if(cur < iso(new Date())){ cur = addDays(cur,1); openNotes.clear(); openEx.clear(); renderTop(); renderDay(); renderPr(); } return; }
  if(b.id==='today-btn'){ cur = iso(new Date()); openNotes.clear(); openEx.clear(); renderTop(); renderDay(); renderPr(); return; }

  if(b.dataset.t){ tab = b.dataset.t;
    $$('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
    ['day','pr','st','more'].forEach(k=>{ $('#p-'+k).hidden = (k!==tab); });
    $('#top').hidden = (tab==='st'||tab==='more');
    if(tab==='st') renderSt(); if(tab==='more') renderMore(); if(tab==='pr') renderPr();
    window.scrollTo(0,0); return; }

  const act = b.dataset.act;
  if(act==='clear'){ const n=+b.dataset.n, m=mark(cur,n);
    if(m){ m.p=''; m.mn=''; m.a=''; m.s=0; clearMark(S.d[cur],n); }
    save(true); refreshCard(n); if(tab==='st') renderSt(); return; }

  /* карточка обета раскрывается и сворачивается */
  if(b.dataset.open){ const n=+b.dataset.open;
    if(openNotes.has(n)) openNotes.delete(n); else openNotes.add(n);
    refreshCard(n); return; }
  if(b.dataset.ex){ const n=+b.dataset.ex; if(openEx.has(n)) openEx.delete(n); else openEx.add(n); refreshCard(n); return; }

  if(b.dataset.step!==undefined){
    const r=parseRef(b.dataset.step), dir=+b.dataset.dir, p=day(cur,true).p;
    const arr = r.k==='m' ? p.m : p.sa;
    arr[r.i] = Math.max(0,(arr[r.i]||0)+dir);
    save(); renderPr(); return;
  }
  if(b.dataset.tog){ const p=day(cur,true).p, k=b.dataset.tog; p[k]=p[k]?0:1; save(); renderPr(); return; }

  /* прибежище: вспомнила, что я — Она. Каждый раз новая цитата из чтений. */
  if(b.dataset.vy){ const r=day(cur,true); r.vy=(r.vy||0)+1;
    if(VQUOTES && VQUOTES.length) S.set.vqi = (((S.set.vqi||0)+1) % VQUOTES.length);
    save(); renderPr(); if(tab==='st') renderSt(); return; }

  /* добрые дела */
  if(b.id==='gdgo'){ addDeed(); return; }
  if(b.dataset.gdx!==undefined){ const i=+b.dataset.gdx, r=day(cur,true);
    r.gd.splice(i,1); save(true); renderPr(); if(tab==='st') renderSt(); return; }
  if(b.dataset.rej){ S.set.rejoiceAck = iso(new Date()); save(true); renderPr();
    toast('Пусть это добро умножится'); return; }
  if(b.dataset.rejDay!==undefined){ S.set.rejoice = +b.dataset.rejDay; S.set.rejoiceAck='';
    save(true); renderMore(); renderPr(); return; }

  /* послание дня — тянется случайно из всех цитат */
  if(b.dataset.msg){ const r=day(cur,true), pool=allQuotes();
    if(pool.length){ let i=Math.floor(Math.random()*pool.length);
      if(pool.length>1 && i===r.msg) i=(i+1)%pool.length;
      r.msg=i; save(true); renderDay(); }
    return; }

  if(b.dataset.ladd!==undefined){ const key=b.dataset.ladd;
    listOf(key).push({ n: key==='m'?'Новая мантра':'Новая садхана', base:0 });
    save(true); renderMore(); renderPr(); return; }
  if(b.dataset.lx!==undefined){ const r=parseRef(b.dataset.lx), list=listOf(r.k);
    if(list.length>1){ const gone=list[r.i].n; list.splice(r.i,1); save(true); renderMore(); renderPr(); renderSt();
      toast('Убрано: '+gone); } return; }

  if(b.dataset.range!==undefined){ stRange = +b.dataset.range; renderSt(); return; }
  if(b.dataset.more){ moreView = b.dataset.more; renderMore(); window.scrollTo(0,0); return; }
  if(b.dataset.theme!==undefined){ S.set.theme=b.dataset.theme; applyTheme(); save(); renderMore(); return; }
  if(b.dataset.cover){ S.set.cover = (S.set.cover===0) ? 1 : 0; save(); renderMore(); renderDay(); return; }
  if(b.dataset.keep){ S.set.keepDays=+b.dataset.keep; save(true); prune(); renderMore(); return; }
  if(b.dataset.cyc){ const i=$('#cd'); i.value = Math.min(46, Math.max(1, (+i.value||1) + (+b.dataset.cyc))); setCycle(+i.value); return; }

  if(b.id==='logout'){ LS.drop(SESS); if(LOCKED){ LS.drop(KEYSTORE); VOWS=null; QUOTES=null; EX={}; }
    $('#top').hidden=true; document.querySelector('main').hidden=true; $('#tabs').hidden=true;
    $('#lock').hidden=false; setupLock(); return; }

  if(b.id==='bk-copy'){ const ta=$('#bk'); ta.select();
    const ok=()=>toast('Копия скопирована');
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(ta.value).then(ok).catch(()=>toast('Текст выделен — скопируйте вручную'));
    else toast('Текст выделен — скопируйте вручную');
    return; }
  if(b.id==='rs-go'){ const v=$('#rs').value.trim(); if(!v){ toast('Вставьте текст копии'); return; }
    try{ const o=JSON.parse(v); if(!o || typeof o!=='object' || !o.set) throw new Error('bad');
      S=Object.assign(blank(),o); S.set=Object.assign(blank().set,o.set||{}); migrate();
      save(true); applyTheme(); cur=iso(new Date()); moreView='root'; renderAll(); toast('Данные восстановлены');
    }catch(err){ toast('Не похоже на резервную копию'); }
    return; }
  if(b.id==='pw-go'){
    const op=$('#op').value, np=$('#np').value, np2=$('#np2').value, er=$('#pw-err');
    if(pwHash(op,S.auth.salt)!==S.auth.h){ er.textContent='Текущий пароль неверен'; return; }
    if(np.length<4){ er.textContent='Новый пароль — не короче 4 символов'; return; }
    if(np!==np2){ er.textContent='Новые пароли не совпадают'; return; }
    const salt=newSalt(); S.auth={salt:salt,h:pwHash(np,salt)}; save(true);
    moreView='root'; renderMore(); toast('Пароль изменён'); return; }
});

/* ===== ввод текста и чисел ===== */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.note!==undefined){ const n=+t.dataset.n, m=ensureMark(cur,n);
    m[t.dataset.note] = t.value; m.s = deriveStatus(m); save(); return; }
  if(t.dataset.set!==undefined){ const r=parseRef(t.dataset.set), p=day(cur,true).p;
    const arr = r.k==='m' ? p.m : p.sa;
    arr[r.i] = Math.max(0, parseInt(t.value,10)||0); save(); return; }
  if(t.dataset.ln!==undefined){ const r=parseRef(t.dataset.ln), list=listOf(r.k);
    if(list[r.i]) list[r.i].n = t.value; save(); return; }
  if(t.dataset.lb!==undefined){ const r=parseRef(t.dataset.lb), list=listOf(r.k);
    if(list[r.i]) list[r.i].base = Math.max(0, parseInt(t.value,10)||0); save(); return; }
  if(t.id==='cd'){ setCycle(Math.min(46,Math.max(1,parseInt(t.value,10)||1))); return; }
  if(t.id==='vq'){ fillVows(t.value); return; }
});

/* запись в «плюс» или «минус» сама ставит отметку, если её ещё нет */
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.note===undefined) return;
  const n=+t.dataset.n, m=mark(cur,n); if(!m) return;
  m.s = deriveStatus(m);
  if(!m.s && !hasNotes(m)) clearMark(S.d[cur],n);
  save(true); refreshCard(n); if(tab==='st') renderSt();
});

function addDeed(){
  const el = $('#gdin'); if(!el) return;
  const v = el.value.trim(); if(!v){ el.focus(); return; }
  day(cur,true).gd.push(v); save(true); renderPr();
  const again = $('#gdin'); if(again) again.focus();
  if(tab==='st') renderSt();
}
/* точка на вкладке «Практики», когда пора порадоваться добрым делам */
function markTabs(){
  const b = document.querySelector('#tabs button[data-t="pr"]');
  if(b) b.classList.toggle('badge', rejoiceDue());
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='gdin'){ e.preventDefault(); addDeed(); return; }
  if(e.target.id==='pw'){ e.preventDefault(); if(!S.auth) $('#pw2').focus(); else tryAuth(); }
  else if(e.target.id==='pw2'){ e.preventDefault(); tryAuth(); }
});

function setCycle(n){ S.set.start = addDays(iso(new Date()), -(n-1)); save(); renderTop(); renderDay(); }
function applyTheme(){ const t=S.set.theme;
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme'); }

/* ===== запуск ===== */
load();
applyTheme();
prune();
(async function boot(){
  if(LOCKED){
    const saved = LS.get(KEYSTORE);
    if(saved && LS.get(SESS)==='1' && cryptoReady()){
      try{ await unlockWithSavedKey(saved); showApp(); return; }
      catch(e){ LS.drop(KEYSTORE); }
    }
    setupLock(); return;
  }
  if(S.auth && LS.get(SESS)==='1') showApp(); else setupLock();
})();
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible' || !$('#lock').hidden) return;
  const t = iso(new Date());
  if(cur > t) cur = t;
  renderTop();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
